# DAPLink Panel Configuration File

# Load the interface configurations for ST-Link


# Load the target configurations for STM32H7 series


# Initialize debugging and flash programming

# This is an Hurricane board with a single STM32F427IIHx chip
#
# Generated by System Workbench for STM32
# Take care that such file, as generated, may be overridden without any early notice. Please have a look to debug launch configuration setup(s)

source [find interface/cmsis-dap.cfg]

set WORKAREASIZE 0x8000

transport select swd

# Stop Watchdog counters when halt
set STOP_WATCHDOG 1

# STlink Debug clock frequency
adapter speed 1800
set CLOCK_FREQ 4000

# use software system reset
reset_config none

set CONNECT_UNDER_RESET 0

source [find target/stm32h7x.cfg]





